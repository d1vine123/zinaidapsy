# Install after the certificate exists. nginx's worker user must be www-data.
upstream zinaidapsy {
    server unix:/run/zinaidapsy-web.sock;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name zinaidapsy.ru www.zinaidapsy.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://zinaidapsy.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.zinaidapsy.ru;
    ssl_certificate /etc/letsencrypt/live/zinaidapsy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zinaidapsy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://zinaidapsy.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zinaidapsy.ru;
    ssl_certificate /etc/letsencrypt/live/zinaidapsy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zinaidapsy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/zinaidapsy.access.log;
    error_log /var/log/nginx/zinaidapsy.error.log;

    # No document root points at the application or its private data.
    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(sqlite3?|db|env|bak|sql)(/|$) {
        return 404;
    }

    location /static/ {
        alias /srv/zinaidapsy/shared/staticfiles/;
        disable_symlinks on from=/srv/zinaidapsy/shared/staticfiles;
        expires 1h;
    }

    location /media/ {
        alias /srv/zinaidapsy/shared/media/;
        disable_symlinks on from=/srv/zinaidapsy/shared/media;
        expires 1h;
    }

    location / {
        proxy_pass http://zinaidapsy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
